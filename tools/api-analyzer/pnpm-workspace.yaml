packages:
  - "."

minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Same reviewed legacy-maintenance exception as common/build/eslint-config-fluid.
  # semver 5.7.2 and 6.3.1 were hand-published; the current 7.x line uses provenance.
  - "semver@5.7.2||6.3.1"
  # Same reviewed Mocha dependency exception as tools/api-markdown-documenter.
  # chokidar 4.0.3 lacks the provenance present in 4.0.1; the maintainer is unchanged.
  - "chokidar@4.0.3"
  # Same reviewed Node types dependency exception as tools/api-markdown-documenter.
  # undici-types 6.21.0 is a type-only release without its prior provenance.
  - "undici-types@6.21.0"
strictDepBuilds: true
engineStrict: true
frozenLockfile: true
strictPeerDependencies: true
updateNotifier: false

packageExtensions:
  # ESLint plugins require the conventional TypeScript API, not the native TS7 API.
  # Resolve their compiler peers with TS6 without changing the analyzer's TS7 dependency.
  "@fluidframework/eslint-config-fluid@*":
    dependencies:
      typescript: "6.0.3"

overrides:
  # Match the shared config's compatibility override: older Rush Stack utilities reject TS6.
  "@rushstack/eslint-plugin>@typescript-eslint/utils@<8.58.0": ~8.58.0
  # Match the shared config's compatibility override for the TSDoc plugin's older utilities.
  "eslint-plugin-tsdoc>@typescript-eslint/utils@<8.58.0": ~8.58.0

allowBuilds:
  # Allow installation of the platform-specific formatter binary.
  '@biomejs/biome': true
  # Match the shared ESLint workspace's permission for the native import resolver.
  unrs-resolver: true
